services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weam_dev_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-weam_research}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weam} -d ${POSTGRES_DB:-weam_research}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
